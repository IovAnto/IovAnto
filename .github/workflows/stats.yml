name: Aggiorna il pannello dati

on:
  schedule:
    # 04:17 UTC: un orario fuori dai minuti tondi, dove la coda di GitHub è
    # meno affollata e le run schedulate partono più puntuali
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rigenera gli SVG
        # Nessun continue-on-error: se l'API non risponde lo script esce con 1
        # senza scrivere, il job fallisce in modo visibile e sul profilo resta
        # l'ultima immagine buona. Un pannello di zeri sarebbe peggio.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/gen_stats.py

      - name: Committa solo se i dati sono cambiati davvero
        run: |
          set -euo pipefail
          # stats.json non contiene l'orario di generazione, gli SVG sì: senza
          # questo confronto il repo prenderebbe un commit ogni notte anche a
          # dati identici, e sembrerebbe attivo senza esserlo.
          if git diff --quiet -- assets/stats.json; then
            echo "Nessun dato cambiato, scarto la rigenerazione."
            git checkout -- assets/
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Aggiorna il pannello dati del profilo"
          git push
